<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){var t=null;try{var q=new URLSearchParams(location.search).get('theme');if(q==='dark'||q==='light'){localStorage.setItem('fq_theme',q);t=q;history.replaceState(null,'',location.pathname+location.hash)}else{t=localStorage.getItem('fq_theme')}}catch(e){}if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)})();</script>
<meta name="theme-color" content="#F6EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#190E09" media="(prefers-color-scheme: dark)">
<title>FIQSTUDIO Project Management</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* FiqStudio workbench: cream paper + terracotta in light, ember-brown in dark. Flat surfaces, hairline borders, one accent. */
:root{
--bg:#F6EFE4;--surf:#FFFDF9;--sub:#FAF4EB;--line:#E6D9C8;--line2:#D3C1AA;--ink:#1C1917;--mute:#5E544D;
--acc:#B8431B;--acc-hov:#9A3412;--acc-tx:#9A3412;--on-acc:#FFFFFF;--accb:#F6E2D6;
--ok:#17734F;--warn:#8F5506;--bad:#B42318;--bad-bg:#FBE9E6;
--st-todo:#B9A894;--st-prog:#B8431B;--st-rev:#C98A1E;--st-hold:#8A7E75;--st-done:#17734F;
--av0:#F3D9C9;--av1:#E9E0C6;--av2:#D9E6D6;--av3:#DCD9EC;--av4:#EFD3D6;--av-ink:#3B2A20;
--scrim:rgba(28,25,23,.45);--sh-pop:0 18px 48px rgba(60,30,15,.22);
--disp:'Plus Jakarta Sans','Inter',system-ui,sans-serif;--sans:'Inter',system-ui,-apple-system,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#190E09;--surf:#211510;--sub:#2A1B14;--line:#3E291F;--line2:#5A3F31;--ink:#F5EFE6;--mute:#C7B8AC;
--acc:#B8431B;--acc-hov:#C9532A;--acc-tx:#FDBA74;--on-acc:#FFFFFF;--accb:#3A2116;
--ok:#5FD3A0;--warn:#F2B95C;--bad:#FF8A7A;--bad-bg:#3A1712;
--st-todo:#7A6656;--st-prog:#E0703F;--st-rev:#E2A23C;--st-hold:#9A8C80;--st-done:#4FBF8C;
--av0:#4A2A1C;--av1:#45391F;--av2:#243A2C;--av3:#2F2C45;--av4:#4A2529;--av-ink:#F5EFE6;
--scrim:rgba(0,0,0,.6);--sh-pop:0 18px 48px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#190E09;--surf:#211510;--sub:#2A1B14;--line:#3E291F;--line2:#5A3F31;--ink:#F5EFE6;--mute:#C7B8AC;
--acc:#B8431B;--acc-hov:#C9532A;--acc-tx:#FDBA74;--on-acc:#FFFFFF;--accb:#3A2116;
--ok:#5FD3A0;--warn:#F2B95C;--bad:#FF8A7A;--bad-bg:#3A1712;
--st-todo:#7A6656;--st-prog:#E0703F;--st-rev:#E2A23C;--st-hold:#9A8C80;--st-done:#4FBF8C;
--av0:#4A2A1C;--av1:#45391F;--av2:#243A2C;--av3:#2F2C45;--av4:#4A2529;--av-ink:#F5EFE6;
--scrim:rgba(0,0,0,.6);--sh-pop:0 18px 48px rgba(0,0,0,.55);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--acc-tx);outline-offset:2px;border-radius:6px}
h1,h2{margin:0;font-weight:700;font-family:var(--disp);text-wrap:balance}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em}
.ser{font:700 22px/1.2 var(--disp);letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px}.nm{font-weight:600}.grow{flex:1;min-width:0}

/* Shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.app>div{min-width:0}
aside{background:var(--surf);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 16px/1 var(--disp);position:relative}
.mark::after{content:"";position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.brand b{font:800 15px/1.15 var(--disp);letter-spacing:.01em;display:block}.brand span{font-size:12px;color:var(--mute)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;gap:10px;align-items:center;min-height:40px;padding:8px 10px;border-radius:8px;color:var(--mute);font-weight:500}
nav a svg,.tabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav a:hover{color:var(--ink);background:var(--sub)}
nav a.on{color:var(--ink);background:var(--accb);font-weight:600}nav a.on svg{color:var(--acc-tx)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font:700 10px var(--sans);flex:none;color:var(--av-ink);background:var(--av0)}
.mk{width:32px;height:32px;border-radius:8px;background:var(--accb);color:var(--acc-tx);display:grid;place-items:center;font:700 13px var(--sans);flex:none}.mk.lg{width:52px;height:52px;border-radius:12px;font:800 22px var(--disp)}
main{padding:32px 40px 80px;max-width:1180px;min-width:0}
.mbar,.tabs,.coltabs,.agenda,.hmx{display:none}

/* Page header & controls */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.ph p{margin:6px 0 0;color:var(--mute);max-width:65ch}.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:40px;padding:0 16px;border:1px solid var(--line2);border-radius:8px;background:var(--surf);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color .12s,border-color .12s}
.btn:hover{background:var(--sub);border-color:var(--mute)}.btn:active{background:var(--line)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}.btn.pri:hover{background:var(--acc-hov);border-color:var(--acc-hov)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surf)}
.seg button{padding:0 14px;min-height:38px;color:var(--mute);font-weight:600}.seg button+button{border-left:1px solid var(--line2)}.seg button.on{background:var(--ink);color:var(--bg)}
.sec{margin-bottom:20px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 8px}.sh h2{font:700 15px var(--disp)}
.lnk{color:var(--acc-tx);font-size:13px;font-weight:600}.lnk:hover{text-decoration:underline}

/* Tables & rows */
.tbl{border-top:1px solid var(--line2)}
main>.tbl{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.tr{display:grid;grid-template-columns:var(--c);gap:16px;align-items:center;margin:0 -8px;padding:12px 8px;border-top:1px solid var(--line);width:calc(100% + 16px);border-radius:6px}
.tr:first-child{border-top:0}.th{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--mute);padding-top:8px;padding-bottom:8px}
a.tr:hover,button.tr:hover{background:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}.bar.w i{background:var(--warn)}.bar.k i{background:var(--ok)}
.pg{display:flex;align-items:center;gap:10px}.pg b{font-weight:600;width:40px;text-align:right}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--accb);color:var(--acc-tx);white-space:nowrap}.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}.st.warn{background:var(--bad-bg);color:var(--warn)}.st.mu{color:var(--mute);background:var(--sub)}
.stg{display:flex;align-items:center;gap:3px}.stg i{width:12px;height:5px;border-radius:2px;background:var(--line)}.stg i.d{background:var(--ink)}.stg i.c{background:var(--acc)}.stg em{font-style:normal;margin-left:8px;font-size:13px}

/* Dashboard */
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:20px;background:var(--surf);border:1px solid var(--line);border-radius:12px}
.facts>div{display:flex;flex-direction:column;padding:18px 22px;border-left:1px solid var(--line)}.facts>div:first-child{border-left:0}
.facts span{color:var(--mute);font-size:13px;font-weight:500}.facts b{font:800 32px/1.2 var(--disp);letter-spacing:-.02em}.facts small{color:var(--mute);font-size:12px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%}
.late{color:var(--bad);font-size:13px;font-weight:600;white-space:nowrap}
.dl{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dt{text-align:center;line-height:1.1}.dt b{font:800 20px var(--disp);display:block}.dt span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.tlv{border-left:2px solid var(--line);margin:12px 0 0 4px}.tlv>div{position:relative;padding:0 0 16px 20px}
.tlv>div::before{content:"";position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--surf);border:2px solid var(--acc)}

/* Master-detail */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.split>div:last-child{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.lst{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:6px}
.lst .li{margin:0;width:100%;padding:10px;border-radius:8px;border-top:0;justify-content:flex-start;text-align:left;min-height:48px}
.lst .li+.li{margin-top:2px}
.li.sel:hover{background:var(--sub)}.li.sel.on{background:var(--accb)}
.pf-h{display:flex;gap:16px;align-items:center;margin-bottom:24px;flex-wrap:wrap}.pf-h>div{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 32px;margin:0 0 28px;padding:16px 0;border-block:1px solid var(--line)}
.kv dt{color:var(--mute);font-size:12px;font-weight:500}.kv dd{margin:0;word-break:break-word}.kv a{color:var(--acc-tx)}
.ws2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px}
.trk{display:grid;grid-template-columns:repeat(5,1fr);margin:20px 0 28px}
.trk>div{position:relative;padding-top:22px;font-size:12px;color:var(--mute)}
.trk>div::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--line)}
.trk .d::before{background:var(--ink)}.trk .c::before{background:linear-gradient(90deg,var(--ink) 6px,var(--line) 6px)}
.trk i{position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:var(--surf);border:2px solid var(--line2);z-index:1}
.trk .d i{background:var(--ink);border-color:var(--ink)}.trk .c i{border-color:var(--acc);background:var(--acc)}.trk .c{color:var(--ink);font-weight:700}
.ms{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cb{width:18px;height:18px;border:1.5px solid var(--line2);border-radius:5px;display:grid;place-items:center;font-size:11px;color:var(--on-acc)}.cb.d{background:var(--ok);border-color:var(--ok)}
.ft{font-size:11px;font-weight:700;background:var(--sub);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--mute);min-width:42px;text-align:center;text-transform:uppercase}
.thumb{display:block;width:52px;height:38px;border-radius:6px;background:var(--surf);border:1px solid var(--line2);position:relative;overflow:hidden;flex:none}
.thumb::before{content:'';position:absolute;inset:0 0 auto;height:12%;background:var(--sub);border-bottom:1px solid var(--line)}
.thumb b{position:absolute;left:8%;right:8%;top:20%;height:36%;border-radius:2px;background:hsl(calc(10 + var(--h) * .12) 62% 48%)}
.thumb s{position:absolute;left:8%;top:63%;width:58%;height:5%;border-radius:2px;background:var(--line2)}.thumb s+s{top:74%;width:38%}
.thumb.lg{width:100%;height:auto;aspect-ratio:16/10;border-radius:10px}
.pvw{display:grid;grid-template-columns:260px 1fr;gap:24px;margin:20px 0 4px;align-items:center}.pvk{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0}.pvk dt{color:var(--mute);font-size:12px}.pvk dd{margin:0;font-weight:600;font-size:15px}

/* Board */
.board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sub);border:1px solid var(--line);border-radius:12px;padding:0 10px 6px}
.col>h3{display:flex;justify-content:space-between;align-items:center;font:700 13px var(--disp);padding:12px 2px;margin:0 0 6px;border-bottom:1px solid var(--line)}
.col>h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c0);margin-right:8px;flex:none}
.col>h3 span{color:var(--mute);font-weight:600;margin-left:auto}
.col>p.sub{padding:4px 2px 10px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .12s}
.card:hover{border-color:var(--acc)}
.cm{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}.cm .av{margin-left:auto}
span.pri{display:inline-flex;align-items:flex-end;gap:2px;height:12px}span.pri i{width:3px;border-radius:1px;background:var(--line2)}.pri i:nth-child(1){height:5px}.pri i:nth-child(2){height:8px}.pri i:nth-child(3){height:12px}
.p3 i{background:var(--bad)}.p2 i:nth-child(-n+2){background:var(--warn)}.p1 i:first-child{background:var(--mute)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surf)}
.cal>div{min-height:104px;padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.cal>div:nth-child(7n){border-right:0}
.cal .h{min-height:0;font-size:12px;font-weight:600;color:var(--mute);padding:8px;background:var(--sub)}.cal .o{background:var(--sub)}.cal b{font-weight:600;font-size:13px}.cal .td b{background:var(--acc);color:var(--on-acc);border-radius:5px;padding:0 6px}
.cal em,.ev{font-style:normal;font-size:12px;margin-top:3px;padding:2px 6px;border-radius:4px;background:var(--accb);color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal em.late,.ev.late{background:var(--bad-bg);color:var(--bad);font-weight:600}.cal em.pj,.ev.pj{background:var(--sub);box-shadow:inset 0 0 0 1px var(--line2)}.cal.wk>div:not(.h){min-height:280px}

/* Reports */
.aiblock{background:var(--surf);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:12px;padding:20px 24px;margin-bottom:20px}
.aiblock p{max-width:66ch;font-size:15px;line-height:1.65;margin:10px 0}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc-tx);background:var(--accb);padding:2px 8px;border-radius:99px;white-space:nowrap}
.mix{display:flex;height:10px;gap:2px;margin:8px 0 12px;border-radius:5px;overflow:hidden}.mix i{display:block}.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--mute)}.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* Settings */
.sg{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px;max-width:880px;background:var(--surf);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}.sg>div:first-child p{margin:4px 0 0;color:var(--mute);font-size:13px}
.set{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.set:first-child{border:0;padding-top:0}
.tg{width:44px;height:26px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background-color .15s}.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surf);transition:transform .15s}
.tg[aria-pressed=true]{background:var(--acc)}.tg[aria-pressed=true]::after{transform:translateX(18px)}

/* Forms, modal, toast */
input,select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line2);border-radius:8px;min-height:44px;padding:0 12px;min-width:0}
input:focus,select:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--accb)}
label{display:grid;gap:6px;font-weight:600;font-size:13px}
#modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}#modal[hidden]{display:none}
.sheet{background:var(--surf);border:1px solid var(--line);border-radius:14px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--sh-pop)}
.sheet h2{font:700 22px var(--disp);margin-bottom:16px}.sheet form{display:grid;gap:14px}.sheet input,.sheet select{width:100%}.sheet .acts{justify-content:flex-end;margin-top:6px}
.sheet>.li{min-height:48px;padding:10px 4px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}#toast.show{opacity:1;transform:translate(-50%,0)}

/* Tablet: icon rail */
@media (min-width:821px) and (max-width:1100px){.app{grid-template-columns:68px 1fr}aside{padding:20px 10px;align-items:center}.brand div:last-child,.n,.me div{display:none}.me{border:0;padding:0}nav a{justify-content:center}main{padding:28px 28px 60px}.dash{grid-template-columns:1fr}.split{grid-template-columns:240px 1fr}.ws2{grid-template-columns:1fr}}

/* Phone */
@media (max-width:820px){
.app{grid-template-columns:1fr}aside{display:none}main{padding:16px max(16px,env(safe-area-inset-right,0px)) 104px max(16px,env(safe-area-inset-left,0px))}h1{font-size:26px}
.mbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--surf);z-index:5;font:800 15px var(--disp)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs a,.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:6px 0;min-height:48px;justify-content:center;text-align:center}.tabs .on{color:var(--acc-tx)}
.dash,.ws2,.split{grid-template-columns:1fr;gap:20px}
.facts{grid-template-columns:1fr 1fr}.facts>div{padding:14px 16px}.facts>div:nth-child(3){border-left:0}.facts>div:nth-child(n+3){border-top:1px solid var(--line)}
